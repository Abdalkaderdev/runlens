<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <title>runlens</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23f44e00' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f44e00'/%3E%3C/svg%3E" />
    <script>
      try { const t = localStorage.getItem('runlens-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
    </script>
    <script type="module" crossorigin src="/assets/index-Cx1k1BWg.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-vbu79x8z.css">
  </head>
  <body>
    <a class="skip" href="#requests">Skip to requests</a>
    <header class="bar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="word">runlens</span>
      </div>
      <div class="app" id="app" translate="no"></div>
      <dl class="stats" id="stats"></dl>
      <div class="actions">
        <button class="btn ghost" id="clear" type="button">Clear</button>
        <button class="btn ghost icon" id="theme" type="button" aria-label="Toggle light and dark theme">
          <span class="theme-glyph" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <main class="layout">
      <section class="left">
        <div class="map-wrap" id="map-wrap">
          <svg id="map" class="map" role="img" aria-label="Service map of routes, services, databases and external APIs"></svg>
          <canvas id="particles" class="particles" aria-hidden="true"></canvas>
          <div class="map-empty" id="map-empty" hidden></div>
          <div class="legend" aria-hidden="true">
            <span><i class="lg-dot"></i>request</span>
            <span><i class="lg-dot slow"></i>slow</span>
            <span><i class="lg-dot err"></i>error</span>
          </div>
        </div>
        <div class="list-head">
          <h2 id="requests">Requests</h2>
          <label class="search">
            <span class="sr">Filter requests</span>
            <input id="filter" type="search" placeholder="Filter by route, status or path…" autocomplete="off" spellcheck="false" />
          </label>
          <div class="toggles" role="group" aria-label="Show only">
            <button class="chip" type="button" data-only="errors" aria-pressed="false">Errors</button>
            <button class="chip" type="button" data-only="slow" aria-pressed="false">Slow</button>
            <button class="chip" type="button" data-only="n1" aria-pressed="false">N+1</button>
          </div>
        </div>
        <div class="list" id="list"></div>
      </section>
      <aside class="right" id="panel" aria-live="polite"></aside>
    </main>
  </body>
</html>
